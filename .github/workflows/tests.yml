name: Tests

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Jobs run inside official Debian containers so that tests use Debian's own
    # python3 package, the same as on the production servers.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: ["bookworm", "trixie"]  # Debian 12 (Python 3.11), Debian 13 (Python 3.13)
    container: debian:${{ matrix.debian }}
    name: test (Debian ${{ matrix.debian }})
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential \
            python3 python3-dev python3-venv \
            libldap-dev libsasl2-dev gettext locales
          echo "fi_FI.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen
      - uses: actions/checkout@v5
      - name: Install Python packages
        run: |
          python3 --version
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -r requirements.txt pytest pytest-cov pytest-django
          echo "/opt/venv/bin" >> "$GITHUB_PATH"
      - name: Check for missing migrations
        run: SIKTEERI_CONFIGURATION=dev python manage.py makemigrations --check --dry-run
      - name: Compile translations
        run: ./compile-translations.sh
      - name: Run tests
        run: ./test.sh
